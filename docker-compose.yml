version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rgi-decor-app
    container_name: rgi-decor-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    networks:
      - rgi-network

networks:
  rgi-network:
    driver: bridge
